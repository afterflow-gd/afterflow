name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: iOS
            os: macos-latest
            target: iOS
            bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
            configure-args: -DSKIP_BUILDING_CODEGEN=OFF
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    continue-on-error: ${{ matrix.config.name == 'iOS' || matrix.config.name == 'Android32' || matrix.config.name == 'Android64' }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          bindings-ref: ${{ matrix.config.bindings-ref }}
          configure-args: ${{ matrix.config.configure-args }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    if: ${{ !cancelled() }}

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
