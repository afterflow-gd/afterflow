name: Build Afterflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2.2.6-beta

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          # Intel runners avoid the long macOS arm64 queue. Both the
          # universal macOS build and the iOS build work on Intel hosts.
          - name: macOS
            os: macos-26-intel
          - name: iOS
            os: macos-26-intel
            target: iOS
            bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
            configure-args: -DSKIP_BUILDING_CODEGEN=OFF
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: latest
          combine: true
          target: ${{ matrix.config.target }}
          bindings-ref: ${{ matrix.config.bindings-ref }}
          configure-args: ${{ matrix.config.configure-args }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    if: ${{ !cancelled() }}

    steps:
      - uses: actions/checkout@v4

      # Pinned: build-geode-mod 61a56c6 flipped `zstd` to true by default, and
      # zstd is exactly what breaks the mod on ios. The geode ios loader has no
      # zstd, so a zstd package lists its entries and extracts none of them, and
      # the game reports "No binary could be found for current platform".
      - uses: geode-sdk/build-geode-mod/combine@61a56c697aea9655e3f31c6c1b83870431f30434
        id: build
        with:
          zstd: false

      - name: Verify the package is readable on ios
        run: python3 tools/check-geode-compression.py "${{ steps.build.outputs.build-output }}"

      - name: Verify the package contains every platform binary
        run: python3 tools/check-geode-platforms.py "${{ steps.build.outputs.build-output }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
